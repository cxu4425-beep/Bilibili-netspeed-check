name: Build executables

on:
  push:
    # A tag publishes a release; a push to a working branch just leaves the
    # executables attached to the run, so there is always something to download
    # without having to tag first.
    tags: ["v*"]
    branches: ["claude/**", "main", "master"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release under this tag (e.g. v1.1.1); leave empty to only build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: BiliLatencyMonitor-windows-x64.zip
          - os: macos-latest
            asset: BiliLatencyMonitor-macos-arm64.zip
          - os: ubuntu-latest
            asset: BiliLatencyMonitor-linux-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/BiliLatencyMonitor.exe, dist/README.md, dist/LICENSE -DestinationPath ${{ matrix.asset }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cp README.md LICENSE dist/
          cd dist && zip -r ../${{ matrix.asset }} BiliLatencyMonitor.app README.md LICENSE

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp README.md LICENSE dist/
          tar -czf ${{ matrix.asset }} -C dist BiliLatencyMonitor README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Either a pushed tag, or a tag named in a manual run - which lets a
          # release be cut from a branch where tags cannot be pushed directly.
          TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          # The first matrix job to arrive creates the release; the others reuse it.
          # Hand-written notes when the tag has them, generated notes otherwise.
          NOTES="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            NOTES_ARG=(--notes-file "$NOTES")
          else
            NOTES_ARG=(--generate-notes)
          fi
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" "${NOTES_ARG[@]}" \
            || gh release view "$TAG"
          # A release made by hand in the web UI has no notes; fill them in.
          if [ -f "$NOTES" ] && [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            gh release edit "$TAG" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" "${{ matrix.asset }}" --clobber
        shell: bash
