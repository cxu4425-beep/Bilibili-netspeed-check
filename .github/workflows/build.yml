name: Build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: BiliLatencyMonitor-windows-x64.zip
          - os: macos-latest
            asset: BiliLatencyMonitor-macos-arm64.zip
          - os: ubuntu-latest
            asset: BiliLatencyMonitor-linux-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/BiliLatencyMonitor.exe, dist/README.md, dist/LICENSE -DestinationPath ${{ matrix.asset }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cp README.md LICENSE dist/
          cd dist && zip -r ../${{ matrix.asset }} BiliLatencyMonitor.app README.md LICENSE

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp README.md LICENSE dist/
          tar -czf ${{ matrix.asset }} -C dist BiliLatencyMonitor README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The first matrix job to arrive creates the release; the others reuse it.
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes \
            || gh release view "${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" "${{ matrix.asset }}" --clobber
        shell: bash
