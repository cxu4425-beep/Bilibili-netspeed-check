name: Create the Android signing key

# Run once, by hand, to create the key the APK is signed with.
#
# The key is generated on the runner and handed back as an artifact, so it
# never passes through a chat window, a commit, or a log. Only someone who can
# see this repository's Actions can download it.
#
# Losing this key is not recoverable: Android refuses an update signed by a
# different key, so every existing install would have to be uninstalled before
# it could take another update. Keep the artifact somewhere safe before it
# expires, and treat that copy as the backup.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Type "regenerate" ONLY if you mean to replace an existing key.
          Leave empty for a first-time setup.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  keystore:
    name: generate
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to replace a key that is already in use
        env:
          EXISTING: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ -n "$EXISTING" ] && [ "$CONFIRM" != "regenerate" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is already set."
            echo "Replacing it would orphan every phone that has the app:"
            echo "Android will not install an update signed by a different key."
            echo 'Re-run with confirm = "regenerate" if that is really intended.'
            exit 1
          fi

      - name: Generate
        run: |
          set -euo pipefail
          mkdir -p out
          # A password the runner invents, so nothing has to be typed anywhere
          # it might be seen or logged.
          PASS=$(head -c 24 /dev/urandom | base64 | tr -d '/+=' | head -c 24)

          keytool -genkeypair -v \
            -keystore out/lagscope.jks \
            -storepass "$PASS" -keypass "$PASS" \
            -alias lagscope -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LagScope, OU=LagScope, O=LagScope, C=TW" \
            >/dev/null 2>&1

          # -w0: one unwrapped line, so it pastes into a secret cleanly.
          base64 -w0 out/lagscope.jks > out/ANDROID_KEYSTORE_BASE64.txt
          printf '%s' "$PASS" > out/ANDROID_KEYSTORE_PASSWORD.txt

          cat > out/README.txt <<'TXT'
          LagScope Android signing key
          ============================

          Two secrets to add, at
            Settings -> Secrets and variables -> Actions -> New repository secret

            ANDROID_KEYSTORE_BASE64     <- the whole of ANDROID_KEYSTORE_BASE64.txt
            ANDROID_KEYSTORE_PASSWORD   <- the whole of ANDROID_KEYSTORE_PASSWORD.txt

          Paste the file contents exactly, with no extra spaces or newlines.

          Then every release build will sign the APK with this key and attach
          it alongside the desktop downloads.

          KEEP lagscope.jks AND THE PASSWORD SOMEWHERE SAFE.

          This key is the app's identity. Android refuses to install an update
          signed by a different key, so if it is lost, everyone with the app
          has to uninstall before they can ever update again. This artifact is
          deleted after a day; the copy you keep is the only backup.

          Nobody else needs it. It signs a sideloaded app - it is not a Play
          Store upload key and cannot be reset by anyone.
          TXT

          # Safe to log: a fingerprint identifies the key without being it.
          # Worth keeping, so a future APK can be checked against it.
          echo "### Certificate fingerprint" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore out/lagscope.jks -storepass "$PASS" \
            | grep -E "SHA256:|Valid from" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-key
          path: out/
          retention-days: 1
          if-no-files-found: error

      - name: What to do next
        run: |
          {
            echo "### Next"
            echo "1. Download the **android-signing-key** artifact from this run."
            echo "2. Add both secrets, named exactly as the files are."
            echo "3. Keep \`lagscope.jks\` and the password somewhere safe - losing"
            echo "   them means nobody with the app can ever update it again."
            echo ""
            echo "The artifact is deleted after one day."
          } >> "$GITHUB_STEP_SUMMARY"
